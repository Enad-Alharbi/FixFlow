<ng-container *transloco="let t">
  <a class="skip-link" href="#main" (click)="skipToMain($event)">{{ t('shell.skipToContent') }}</a>

  <header class="bar">
    <div class="bar-inner">
      <a class="brand" [routerLink]="home()">{{ t('app.name') }}</a>

      @if (plane() === 'platform') {
        <span class="plane-tag">{{ t('shell.platform') }}</span>
      } @else if (auth.user()?.tenant; as tenant) {
        <!-- Which organization you are working in. bdi: a name in the other script doesn't flip the bar. -->
        <bdi class="tenant-name">{{ tenant.name }}</bdi>
      }

      <nav class="nav" [attr.aria-label]="t('shell.mainNav')">
        @for (item of nav(); track item.path) {
          <a
            class="nav-link"
            [routerLink]="item.path"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            [routerLinkActiveOptions]="{ exact: !!item.exact }"
            >{{ t(item.labelKey) }}</a
          >
        }
      </nav>

      <div class="bar-end">
        <app-language-switcher />
        @if (auth.user(); as user) {
          <bdi class="user-name">{{ user.displayName }}</bdi>
          <button type="button" class="bar-button" (click)="signOut()">
            <tabler-icon [icon]="signOutIcon" class="icon-mirror" aria-hidden="true" />{{
              t('shell.signOut')
            }}
          </button>
        }
      </div>
    </div>
  </header>

  <main id="main" #main tabindex="-1">
    <router-outlet />
  </main>
  <app-toaster />
</ng-container>
